name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: |
          npm install -g cordova

      - name: Create Cordova Project & Build Physical iOS Binary
        run: |
          cordova create build_tmp com.phone.ptaios "PTA_iOS"
          cp index.html styles.css app.js build_tmp/www/
          cd build_tmp
          cordova platform add ios@latest
          cd platforms/ios
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath ./build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS="" build

      - name: Package IPA File
        run: |
          APP_PATH=$(find build_tmp -name "*.app" -type d | head -n 1)
          echo "Found Device APP at $APP_PATH"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r PTA-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PTA-iOS-IPA
          path: PTA-iOS.ipa
